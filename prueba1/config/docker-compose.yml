services:

  pd:
    image: pingcap/pd:v8.5.8
    container_name: tidb-pd
    command:
      - --name=pd
      - --data-dir=/data/pd
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
    volumes:
      - pd-data:/data/pd
    ports:
      - "2379:2379"
      - "2380:2380"

  tikv:
    image: pingcap/tikv:v8.5.8
    container_name: tidb-tikv
    command:
      - --pd=pd:2379
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --data-dir=/data/tikv
    depends_on:
      - pd
    volumes:
      - tikv-data:/data/tikv
    ports:
      - "20160:20160"

  tidb:
    image: pingcap/tidb:v8.5.8
    container_name: tidb-server
    command:
      - --store=tikv
      - --path=pd:2379
      - --host=0.0.0.0
    depends_on:
      - pd
      - tikv
    ports:
      - "4000:4000"
      - "10080:10080"

volumes:
  pd-data:
  tikv-data:
